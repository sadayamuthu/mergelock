# .deb and .rpm packages, built by the release workflow with nfpm
# (https://nfpm.goreleaser.com). VERSION and ARCH come from the environment.
name: mergelock
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: devel
priority: optional
maintainer: ksadayamuthu <ksadayamuthu@outlook.com>
description: |
  Finds merge conflicts git can't see between branches: changed signatures
  against new call sites, deleted symbols still in use, duplicate functions.
  TypeScript, JavaScript and Python. CLI and MCP server.
vendor: sadayamuthu
homepage: https://github.com/sadayamuthu/mergelock
license: Apache-2.0
contents:
  - src: dist/mergelock
    dst: /usr/bin/mergelock
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/doc/mergelock/LICENSE
  - src: README.md
    dst: /usr/share/doc/mergelock/README.md
  - src: USAGE.md
    dst: /usr/share/doc/mergelock/USAGE.md
overrides:
  deb:
    depends:
      - git (>= 1:2.38)
  rpm:
    depends:
      - git >= 2.38
