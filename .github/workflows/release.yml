name: Release

# Push a tag like v0.1.0 to publish a GitHub Release with prebuilt binaries
# and .deb/.rpm packages, a Docker image on GHCR, an MCP Registry entry and
# the Homebrew formula in sadayamuthu/homebrew-tap, and moves the major tag
# (v0) that `uses: sadayamuthu/mergelock@v0` resolves to.
# Run it manually (Actions → Release → Run workflow) to build every binary
# without publishing anything.
on:
  push:
    tags: ['v*.*.*']   # not v0: that tag only tracks the latest release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -short ./...

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          # tree-sitter needs cgo, so each target gets a C compiler for its
          # platform. Linux builds are static so they run on any distro.
          - { goos: linux,  goarch: amd64, runner: ubuntu-latest, cc: gcc,                     static: true }
          - { goos: linux,  goarch: arm64, runner: ubuntu-latest, cc: aarch64-linux-gnu-gcc,   static: true }
          - { goos: darwin, goarch: arm64, runner: macos-latest,  cc: clang }
          - { goos: darwin, goarch: amd64, runner: macos-latest,  cc: clang -arch x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install cross compiler
        if: matrix.cc == 'aarch64-linux-gnu-gcc'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ldflags="-s -w -X main.version=${VERSION}"
          tags=""
          if [ "${{ matrix.static }}" = "true" ]; then
            ldflags="${ldflags} -linkmode external -extldflags -static"
            tags="-tags netgo,osusergo"
          fi
          go build -trimpath $tags -ldflags "$ldflags" -o dist/mergelock ./cmd/mergelock
          file dist/mergelock
      - name: Smoke test
        if: matrix.goarch == 'amd64' && matrix.goos == 'linux' || matrix.goarch == 'arm64' && matrix.goos == 'darwin'
        run: ./dist/mergelock version
      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="mergelock_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          cp LICENSE README.md USAGE.md dist/
          tar -czf "${name}.tar.gz" -C dist mergelock LICENSE README.md USAGE.md
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - name: Linux packages (.deb, .rpm)
        if: matrix.goos == 'linux'
        env:
          TAG: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.goarch }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          if [[ "$TAG" == v* ]]; then VERSION="${TAG#v}"; else VERSION="0.0.0~${TAG}"; fi
          export VERSION
          nfpm package -f packaging/nfpm.yaml -p deb -t .
          nfpm package -f packaging/nfpm.yaml -p rpm -t .
          ls -la *.deb *.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            *.deb
            *.rpm
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.deb *.rpm > checksums.txt
          cat checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" dist/*.tar.gz dist/*.deb dist/*.rpm dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $prerelease

  # Multi-arch image on GHCR, used by `docker run` and the MCP Registry.
  # Manual runs build it without pushing.
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
            tags="${image}:${version#v}"
            [[ "$version" != *-* ]] && tags="${tags},${image}:latest"
          else
            version="dev-${GITHUB_SHA::7}"
            tags="${image}:${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # Publishes server.json, pointed at this version's image, to
  # registry.modelcontextprotocol.io. Prereleases are skipped.
  mcp-registry:
    needs: [release, docker]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          jq --arg v "$v" '.version = $v | .packages[0].identifier = "ghcr.io/sadayamuthu/mergelock:" + $v' \
            server.json > server.json.tmp && mv server.json.tmp server.json
          cat server.json
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  # Updates Formula/mergelock.rb in sadayamuthu/homebrew-tap. Needs the
  # HOMEBREW_TAP_TOKEN secret: a fine-grained token with Contents read/write on
  # that repository only. Skipped for prereleases and when the secret is unset.
  homebrew:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check for token
        if: env.TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew formula update."
      - uses: actions/checkout@v4
        if: env.TAP_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.TAP_TOKEN != ''
        with:
          path: dist
          merge-multiple: true
      - name: Update formula
        if: env.TAP_TOKEN != ''
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/sadayamuthu/homebrew-tap.git" tap
          packaging/homebrew-formula.sh "$TAG" dist > tap/Formula/mergelock.rb
          cd tap
          git diff --stat
          git -c user.name=ksadayamuthu -c user.email=ksadayamuthu@outlook.com \
            commit -am "mergelock ${TAG#v}"
          git push

  # Points the major tag (v0 for v0.x.y) at this release, so workflows using
  # `sadayamuthu/mergelock@v0` pick up action.yml changes. Skipped for
  # prereleases.
  action-tag:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
